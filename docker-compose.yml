services:
  app:
    build: .
    container_name: hybridsearch-api
    # Connects to AWS Managed OpenSearch + S3 using the values in .env
    # (OPENSEARCH_HOST/PORT, HS_STORAGE_BACKEND=s3, ...). No local OpenSearch.
    # On EC2 the app reaches the VPC domain directly; AWS credentials come from
    # the instance role via IMDS, so .env keeps the AWS_* keys commented out.
    env_file:
      # Required: the whole connection (Managed host, S3 bucket) lives here.
      - path: .env
        required: true
    ports:
      - "8000:8000"
    volumes:
      # Local storage backend reads/writes images + manifest here.
      - ./data:/app/data
      # Persist the downloaded embedding model across restarts.
      - hf-cache:/app/.cache/huggingface

  # Streamlit FE (8501). Same image as `app`; just a different command.
  # Calls the coordinator over the compose network (http://app:8000).
  fe:
    build: .
    container_name: hybridsearch-fe
    depends_on:
      - app
    env_file:
      - path: .env
        required: true
    environment:
      # On EC2 (both as host processes) this would be localhost; in compose the
      # API is reachable by its service name.
      - HS_API_URL=http://app:8000
    ports:
      - "8501:8501"
    command:
      - uv
      - run
      - --no-dev
      - streamlit
      - run
      - streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0

volumes:
  hf-cache:
