services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-dev
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true          # dev only: no auth / SSL (skips demo-config password requirement)
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    healthcheck:
      # Lets `app` wait for a queryable cluster (depends_on: service_healthy).
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    container_name: hybridsearch-api
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      # Reach OpenSearch over the compose network, not localhost.
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
    env_file:
      - path: .env                             # optional; overrides the above if present
        required: false
    ports:
      - "8000:8000"
    volumes:
      # Local storage backend reads/writes images + manifest here.
      - ./data:/app/data
      # Persist the downloaded embedding model across restarts.
      - hf-cache:/app/.cache/huggingface

volumes:
  hf-cache:
